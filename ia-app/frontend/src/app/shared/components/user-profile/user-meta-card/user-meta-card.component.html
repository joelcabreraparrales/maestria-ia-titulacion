<div class="p-5 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
  <div class="flex flex-col gap-5 xl:flex-row xl:items-center xl:justify-between">
    <div class="flex flex-col items-center w-full gap-6 xl:flex-row">

      <!-- Avatar con iniciales -->
      <div class="flex items-center justify-center w-20 h-20 overflow-hidden border border-gray-200 rounded-full bg-brand-100 dark:border-gray-800 dark:bg-brand-900 shrink-0">
        @if (profile) {
          <span class="text-2xl font-bold text-brand-600 dark:text-brand-300 select-none">
            {{ getInitials() }}
          </span>
        } @else {
          <span class="text-2xl text-gray-400">?</span>
        }
      </div>

      <!-- Nombre y rol -->
      <div>
        @if (profile) {
          <h4 class="mb-1 text-lg font-semibold text-center text-gray-800 dark:text-white/90 xl:text-left">
            {{ getFullName() }}
          </h4>
          <p class="text-sm text-gray-500 dark:text-gray-400 text-center xl:text-left">
            {{ role }}
          </p>
          <p class="text-sm text-gray-400 dark:text-gray-500 text-center xl:text-left mt-1">
            {{ profile.email }}
          </p>
        } @else {
          <div class="h-5 w-40 bg-gray-200 rounded animate-pulse mb-2"></div>
          <div class="h-4 w-24 bg-gray-100 rounded animate-pulse"></div>
        }
      </div>

    </div>
  </div>
</div>
