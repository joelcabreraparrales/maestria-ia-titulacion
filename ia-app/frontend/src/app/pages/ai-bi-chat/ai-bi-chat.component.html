<app-page-breadcrumb pageTitle="AI Business Intelligence" />

<div class="space-y-6">
  <app-chat-hero-banner />

  @if (hasRealData && currentCharts.length > 0) {
    <app-chat-charts-grid [charts]="currentCharts" />
  } @else {
    <app-chat-empty-state />
  }

  <app-chat-sample-queries
    [queries]="sampleQueries"
    (querySelected)="onQuerySelected($event)"
  />
</div>

<app-chat-panel
  [messages]="messages"
  [isOpen]="isChatOpen"
  [isTyping]="isTyping"
  [prefillMessage]="prefillMessage"
  (toggle)="toggleChat()"
  (closed)="isChatOpen = false"
  (messageSent)="handleMessageSent($event)"
  (followUpSelected)="handleMessageSent($event)"
/>
