<!-- ════════════════════ FLOATING CHAT ════════════════════════ -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

  <!-- Chat Panel -->
  @if (isOpen) {
    <div class="chat-panel flex h-[560px] w-80 flex-col overflow-hidden rounded-2xl border border-gray-200/60 bg-white shadow-2xl dark:border-gray-700/50 dark:bg-gray-900 sm:w-96">

      <!-- Header -->
      <div class="flex flex-shrink-0 items-center gap-3 bg-gradient-to-r from-brand-500 to-purple-600 px-4 py-3">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-white/20 ai-breathe">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/>
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold leading-none text-white mb-1">Asistente IA · BI</p>
          <div class="flex items-center gap-1.5">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-300 opacity-75"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-green-400"></span></span>
            <span class="text-xs text-white/75">En línea · Text-to-SQL activo</span>
          </div>
        </div>
        <button (click)="closed.emit()" class="flex h-8 w-8 items-center justify-center rounded-full text-white/70 transition-colors hover:bg-white/20 hover:text-white" [innerHTML]="icons.close | safeHtml"></button>
      </div>

      <!-- Messages -->
      <div #msgContainer class="flex-1 space-y-4 overflow-y-auto bg-gray-50 p-4 custom-scrollbar dark:bg-gray-900/50">

        @for (msg of messages; track msg.id; let i = $index) {
          <app-chat-message
            [message]="msg"
            [animationDelay]="(i * 40) + 'ms'"
            (followUpSelected)="followUpSelected.emit($event)"
          />
        }

        <!-- Typing indicator -->
        @if (isTyping) {
          <div class="flex gap-2.5">
            <div class="mt-1 flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-purple-600">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/>
              </svg>
            </div>
            <div class="rounded-2xl rounded-tl-sm bg-white px-4 py-3 shadow-sm dark:bg-gray-800">
              <div class="flex items-center gap-1">
                <span class="h-1.5 w-1.5 rounded-full bg-gray-400 dot-1"></span>
                <span class="h-1.5 w-1.5 rounded-full bg-gray-400 dot-2"></span>
                <span class="h-1.5 w-1.5 rounded-full bg-gray-400 dot-3"></span>
              </div>
            </div>
          </div>
        }

      </div>

      <!-- Input area -->
      <div class="flex-shrink-0 border-t border-gray-100 bg-white p-3 dark:border-gray-800 dark:bg-gray-900">
        <div class="flex items-center gap-2 rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 transition-all focus-within:border-brand-400 focus-within:ring-2 focus-within:ring-brand-400/20 dark:border-gray-700 dark:bg-gray-800 dark:focus-within:border-brand-500">
          <input [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" type="text" placeholder="Escribe tu consulta..." [disabled]="isTyping"
            class="flex-1 bg-transparent text-sm text-gray-700 placeholder-gray-400 outline-none dark:text-gray-300 dark:placeholder-gray-500"/>
          <button (click)="sendMessage()" [disabled]="!userMessage.trim() || isTyping"
            class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg bg-brand-500 text-white transition-all hover:bg-brand-600 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40"
            [innerHTML]="icons.send | safeHtml">
          </button>
        </div>
        <p class="mt-2 text-center text-xs text-gray-400 dark:text-gray-600">Powered by LLM + Text-to-SQL · Tesis Maestría IA</p>
      </div>

    </div>
  }

  <!-- Toggle button -->
  <div class="group relative">
    @if (!isOpen) {
      <div class="pointer-events-none absolute bottom-full right-0 mb-2.5 opacity-0 transition-opacity duration-200 group-hover:opacity-100">
        <div class="rounded-lg bg-gray-900 px-3 py-1.5 text-xs font-medium whitespace-nowrap text-white dark:bg-gray-700">
          ¿Tienes preguntas?
          <div class="absolute right-4 top-full h-2 w-2 -mt-1 rotate-45 bg-gray-900 dark:bg-gray-700"></div>
        </div>
      </div>
    }
    <button (click)="toggle.emit()"
      class="btn-pulse relative flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-purple-600 text-white shadow-lg shadow-brand-500/40 transition-transform duration-200 hover:scale-110 active:scale-95"
      [innerHTML]="icons.chat | safeHtml">
    </button>
    @if (!isOpen) {
      <span class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-xs font-bold text-white shadow-sm">1</span>
    }
  </div>

</div>
